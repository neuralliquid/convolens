schema: md-agent/v1
source: docs/VOICE-NOTE-TRANSCRIPTION.md
title: "Voice-note transcription"
purpose: "Production contract for per-message WhatsApp voice-note transcription. Implemented behind a disabled-by-default gate; a merge or healthy endpoint is not enough to enable it."
audience:
  - agent
  - human
facts:
  - "Status is implemented behind a disabled-by-default production gate; the API returns a privacy-safe 503 before transmitting audio until all gates pass."
  - "Processing path is ConvoLens -> xtox -> Sluice -> Azure AI Foundry Whisper -> xtox -> ConvoLens. Do not call Foundry from ConvoLens."
  - "ConvoLens verifies conversation and audio-message ownership, holds uploaded audio in request memory only, and never writes audio to ConvoLens storage, database, logs, metrics, or traces."
  - "xtox is authorized with the current Mystira user token; ConvoLens's internal API JWT is never reused as an xtox credential."
  - "Logs may contain bounded error codes only — never filenames, audio, transcript text, provider bodies, or bearer tokens."
  - "Default quota is 10 transcriptions per user per hour via VOICE_NOTE_TRANSCRIPTIONS_PER_HOUR, applied before reading the upload body. Scale-out requires a shared limiter."
  - "Transcripts persist as sibling message_transcripts rows, excluded from content hashes and dedup identity, and cascade-delete with the conversation."
  - "Consent is per voice note; the API requires modelProcessingConsent=true and the UI must name every processor."
  - "ConvoLens sends audio only with retain=false after XTOX_EPHEMERAL_TRANSCRIPTION_VERIFIED=true proves no MongoDB transcript row is created."
  - "Production enablement requires XTOX_BASE_URL, FEATURE_VOICE_TRANSCRIPTION=true, and XTOX_EPHEMERAL_TRANSCRIPTION_VERIFIED=true only after xtox health, Mystira token acceptance, retain=false proof, and a real Sluice/Foundry transcript."
  - "Acoustic tone, inclination, and emotion indicators are out of this contract; see docs/prd/PRD-001-media-tone-inclination-emotion.md (Baton 3d7873a0) and reuse this path and gates."
last_synced: "2026-08-21"
