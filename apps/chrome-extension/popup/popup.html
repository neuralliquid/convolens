<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConvoLens</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 320px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(
          135deg,
          #f0fdf4 0%,
          #ffffff 50%,
          #f0fdf4 100%
        );
      }

      .header {
        background: linear-gradient(135deg, #16a36a 0%, #0b6b57 100%);
        padding: 16px 20px;
        color: white;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 700;
      }

      .preview-badge {
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 999px;
        padding: 2px 7px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .header p {
        font-size: 12px;
        opacity: 0.9;
        margin-top: 3px;
      }

      .content {
        padding: 20px;
      }

      .status-card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .status-card h3 {
        font-size: 14px;
        color: #333;
        margin-bottom: 8px;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #dc2626;
      }

      .status-dot.connected {
        background: #25d366;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      button {
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
      }

      .btn-secondary {
        background: white;
        color: #333;
        border: 1px solid #e5e7eb;
      }

      .btn-secondary:hover {
        background: #f9fafb;
      }

      .login-form {
        display: none;
      }

      .login-form.show {
        display: block;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group label {
        display: block;
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }

      .form-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
      }

      .form-group input:focus {
        outline: none;
        border-color: #25d366;
        box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
      }

      .error {
        color: #dc2626;
        font-size: 12px;
        margin-top: 8px;
      }

      .action-status {
        display: none;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.4;
      }

      .action-status.show {
        display: block;
      }

      .action-status.info {
        color: #1e3a8a;
        background: #eff6ff;
      }

      .action-status.success {
        color: #065f46;
        background: #ecfdf5;
      }

      .action-status.error {
        color: #991b1b;
        background: #fef2f2;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: #f0fdf4;
        border-radius: 8px;
        margin-bottom: 16px;
      }

      .user-avatar {
        width: 40px;
        height: 40px;
        background: #25d366;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
      }

      .user-details h4 {
        font-size: 14px;
        color: #333;
      }

      .user-details {
        min-width: 0;
      }

      .user-details p {
        font-size: 12px;
        color: #666;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .footer {
        padding: 12px 20px;
        font-size: 11px;
        color: #999;
        border-top: 1px solid #f0f0f0;
      }

      .footer-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .extension-version {
        color: #777;
        font-variant-numeric: tabular-nums;
      }

      .footer-connector {
        margin-top: 2px;
        text-align: center;
      }

      .footer a {
        color: #25d366;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img class="brand-icon" src="../icons/icon-48.png" alt="" />
      <div class="brand-copy">
        <div class="brand-title">
          <h1>ConvoLens</h1>
          <span class="preview-badge">Preview</span>
        </div>
        <p>WhatsApp conversation intake</p>
      </div>
    </div>

    <div class="content">
      <div class="status-card">
        <h3>WhatsApp connection</h3>
        <div class="status-indicator">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Checking...</span>
        </div>
      </div>

      <div id="authSection">
        <!-- Logged out state -->
        <div id="loggedOut" style="display: none">
          <div class="login-form show">
            <p style="font-size: 13px; color: #666; margin-bottom: 12px">
              Sign in once with Mystira Identity, then connect that session to
              the extension.
            </p>
            <div class="error" id="loginError"></div>
            <div class="actions">
              <button class="btn-primary" id="signupBtn">
                Sign in to ConvoLens
              </button>
              <button class="btn-secondary" id="loginBtn">
                I&apos;ve signed in — connect
              </button>
            </div>
          </div>
        </div>

        <!-- Logged in state -->
        <div id="loggedIn" style="display: none">
          <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-details">
              <h4 id="userName">User</h4>
              <p id="userEmail">user@example.com</p>
            </div>
          </div>
          <div class="actions">
            <button class="btn-primary" id="openDashboard">
              Open Dashboard
            </button>
            <button class="btn-secondary" id="extractBtn">
              Send Current Chat
            </button>
            <button class="btn-secondary" id="logoutBtn">Sign Out</button>
            <div
              class="action-status"
              id="actionStatus"
              role="status"
              aria-live="polite"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-primary">
        <span>
          <a
            href="https://convolens.neuralliquid.ai/dashboard"
            id="dashboardLink"
            target="_blank"
            >ConvoLens</a
          >
          Preview
        </span>
        <span
          class="extension-version"
          id="extensionVersion"
          aria-label="Extension version"
        ></span>
      </div>
      <div class="footer-connector">WhatsApp is the first connector</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
