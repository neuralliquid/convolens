name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Protected GitHub environment and Azure production target
        required: true
        default: Production
        type: choice
        options:
          - Production
          - Production-NeuralLiquid

concurrency:
  # Scope by environment so Production and Production-NeuralLiquid do not
  # share a group. GitHub still keeps only one pending run per group.
  group: deploy-prod-${{ github.ref }}-${{ inputs.deployment_environment }}

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.14.7"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  ENVIRONMENT: prod
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_OBJECT_ID }}

jobs:
  deploy:
    name: Deploy ConvoLens Production
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Verify Production Ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Error: production deployments must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Error: checked-out commit does not match the workflow dispatch SHA." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify Azure OIDC Configuration
        run: |
          set -euo pipefail
          for v in "$ARM_CLIENT_ID" "$ARM_TENANT_ID" "$ARM_SUBSCRIPTION_ID"; do
            if [ -z "$v" ]; then
              echo "Error: AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID repository variables are required for OIDC deploys." >&2
              exit 1
            fi
          done

      - name: Resolve Deployment Target
        id: target
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_ENVIRONMENT" in
            Production)
              expected_subscription="bb4e3882-2079-4bab-8974-611bc0b8bb58"
              expected_tenant="9530cd32-9e33-47f0-9247-ed964730b580"
              suffix=""
              backend_config="backend.hcl"
              tfstate_account="nltfstateconvolens"
              key_vault_name="nl-prod-convolens-kv"
              web_name="nl-prod-convolens-web"
              manage_runtime_secrets="true"
              enable_sluice="false"
              deployment_object_id=""
              ;;
            Production-NeuralLiquid)
              expected_subscription="5a95ddee-dd63-441a-8306-c8b0803dcdd4"
              expected_tenant="5384ef74-e517-4b22-9472-df990f61e8b5"
              suffix="nl"
              backend_config="backend.neuralliquid.hcl"
              tfstate_account="nltfstateconvolensnl"
              key_vault_name="nl-prod-convolens-nl-kv"
              web_name="nl-prod-convolens-web-nl"
              manage_runtime_secrets="false"
              enable_sluice="true"
              if [ -z "$DEPLOYMENT_PRINCIPAL_OBJECT_ID" ]; then
                echo "Error: Production-NeuralLiquid requires AZURE_OBJECT_ID for scoped Key Vault secret preload." >&2
                exit 1
              fi
              deployment_object_id="$DEPLOYMENT_PRINCIPAL_OBJECT_ID"
              ;;
            *)
              echo "Error: unsupported deployment environment '$DEPLOYMENT_ENVIRONMENT'." >&2
              exit 1
              ;;
          esac
          if [ "$ARM_SUBSCRIPTION_ID" != "$expected_subscription" ] || [ "$ARM_TENANT_ID" != "$expected_tenant" ]; then
            echo "Error: $DEPLOYMENT_ENVIRONMENT credentials target the wrong Azure tenant or subscription." >&2
            exit 1
          fi
          echo "TF_VAR_global_name_suffix=$suffix" >> "$GITHUB_ENV"
          echo "TF_VAR_manage_runtime_secrets_with_terraform=$manage_runtime_secrets" >> "$GITHUB_ENV"
          echo "TF_VAR_enable_sluice=$enable_sluice" >> "$GITHUB_ENV"
          echo "TF_VAR_deployment_principal_object_id=$deployment_object_id" >> "$GITHUB_ENV"
          echo "backend-config=$backend_config" >> "$GITHUB_OUTPUT"
          echo "tfstate-account=$tfstate_account" >> "$GITHUB_OUTPUT"
          echo "key-vault-name=$key_vault_name" >> "$GITHUB_OUTPUT"
          echo "web-name=$web_name" >> "$GITHUB_OUTPUT"

      - name: Verify Runtime Authentication Inputs
        env:
          MYSTIRA_IDENTITY_CLIENT_ID: ${{ secrets.MYSTIRA_IDENTITY_CLIENT_ID }}
          API_JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ "$MYSTIRA_IDENTITY_CLIENT_ID" != "neuralliquid-convolens-web" ]; then
            echo "Error: MYSTIRA_IDENTITY_CLIENT_ID must be the seeded neuralliquid-convolens-web client." >&2
            exit 1
          fi
          if [ "$TF_VAR_manage_runtime_secrets_with_terraform" = "true" ] && [ "${#API_JWT_SECRET}" -lt 32 ]; then
            echo "Error: the legacy Terraform-managed API JWT secret must be at least 32 characters." >&2
            exit 1
          fi

      # Sluice owns provider credentials, model routing, budgets and telemetry,
      # and is the only path on which this service's model spend is attributable
      # (Sluice ADR 10). The application degrades to a direct provider when the
      # key is absent — quietly, and billed with no record of which service
      # incurred it. That degradation is acceptable locally and not in
      # production, so the refusal lives here rather than in a Terraform
      # variable: a required variable would break every plan and apply for
      # everyone, while this fails only the thing that should fail, loudly.
      - name: Verify Governed AI Configuration
        if: inputs.deployment_environment == 'Production'
        env:
          SLUICE_API_KEY: ${{ secrets.SLUICE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SLUICE_API_KEY" ]; then
            echo "Error: the restricted SLUICE_API_KEY production secret is required for grounded catch-ups." >&2
            echo "Without it the service falls back to a direct provider and its spend is not attributable." >&2
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify NeuralLiquid Vault Is Ready
        if: inputs.deployment_environment == 'Production-NeuralLiquid'
        run: |
          set -euo pipefail
          az keyvault show --name "${{ steps.target.outputs.key-vault-name }}" --only-show-errors >/dev/null
          for secret_name in api-jwt-secret sluice-api-key nextauth-secret mystira-identity-client-secret shared-pg-convolens-password; do
            secret_enabled=$(az keyvault secret show \
              --vault-name "${{ steps.target.outputs.key-vault-name }}" \
              --name "$secret_name" \
              --query attributes.enabled \
              --output tsv 2>/dev/null || true)
            if [ "$secret_enabled" != "true" ]; then
                echo "Error: required target-vault secret '$secret_name' is missing or disabled; run the separate bootstrap and direct-transfer procedure first." >&2
                exit 1
            fi
          done

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile --reporter=append-only
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Build API and Web
        timeout-minutes: 15
        run: pnpm run build
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: https://placeholder.invalid/api
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.invalid

      - name: Smoke Test API Build
        timeout-minutes: 2
        env:
          JWT_SECRET: ci-startup-smoke-only-not-a-production-secret
        run: |
          DB_PATH="${RUNNER_TEMP}/convolens-api-smoke.sqlite"
          NODE_ENV=production \
            JWT_SECRET="$JWT_SECRET" \
            PORT=3001 \
            DB_TYPE=sqlite \
            DATABASE_PATH="$DB_PATH" \
            DB_MIGRATIONS_RUN=true \
            node apps/api/dist/index.js > api-startup.log 2>&1 &
          API_PID=$!
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:3001/health" > /dev/null; then
              kill "$API_PID"
              wait "$API_PID" || true
              exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat api-startup.log
              exit 1
            fi
            sleep 1
          done
          cat api-startup.log
          kill "$API_PID"
          wait "$API_PID" || true
          echo "API build did not become ready within 30 seconds." >&2
          exit 1

      - name: Ensure Terraform Backend
        run: |
          set -euo pipefail
          if [ "${{ inputs.deployment_environment }}" = "Production-NeuralLiquid" ]; then
            az group show --name nl-tfstate-rg --only-show-errors >/dev/null
            az storage account show \
              --resource-group nl-tfstate-rg \
              --name "${{ steps.target.outputs.tfstate-account }}" \
              --only-show-errors >/dev/null
            az storage container create \
              --name tfstate \
              --account-name "${{ steps.target.outputs.tfstate-account }}" \
              --auth-mode login \
              --output none
            exit 0
          fi
          TFSTATE_RG_LOCATION=$(az group show \
            --name nl-tfstate-rg \
            --query location \
            -o tsv 2>/dev/null || true)
          if [ -z "$TFSTATE_RG_LOCATION" ]; then
            TFSTATE_RG_LOCATION=southafricanorth
            az group create \
              --name nl-tfstate-rg \
              --location "$TFSTATE_RG_LOCATION" \
              --tags project=convolens purpose=tfstate environment=prod
          fi
          if ! az storage account show \
            --resource-group nl-tfstate-rg \
            --name "${{ steps.target.outputs.tfstate-account }}" \
            --only-show-errors >/dev/null 2>&1; then
            az storage account create \
              --resource-group nl-tfstate-rg \
              --name "${{ steps.target.outputs.tfstate-account }}" \
              --location "$TFSTATE_RG_LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --https-only true \
              --tags project=convolens purpose=tfstate environment=prod
          fi
          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group nl-tfstate-rg \
            --account-name "${{ steps.target.outputs.tfstate-account }}" \
            --query '[0].value' \
            -o tsv)
          az storage container create \
            --name tfstate \
            --account-name "${{ steps.target.outputs.tfstate-account }}" \
            --account-key "$ACCOUNT_KEY"

      - name: Terraform Init
        run: terraform -chdir=infra/terraform/env/prod init -backend-config="${{ steps.target.outputs.backend-config }}"

      - name: Verify PostgreSQL SKU Availability
        run: |
          set -euo pipefail
          if ! grep -Eq '^enable_postgres[[:space:]]*=[[:space:]]*true([[:space:]]|$)' infra/terraform/env/prod/terraform.tfvars; then
            echo "PostgreSQL provisioning is disabled; skipping irrelevant SKU capacity check."
            exit 0
          fi
          AVAILABLE_SKUS=$(az postgres flexible-server list-skus \
            --location southafricanorth \
            --query '[].supportedServerEditions[].supportedServerSkus[].name' \
            -o tsv)
          if ! grep -Eq '(^|_)Standard_B1ms$' <<< "$AVAILABLE_SKUS"; then
            echo "PostgreSQL Flexible Server SKU Standard_B1ms is not available in southafricanorth." >&2
            echo "$AVAILABLE_SKUS"
            exit 1
          fi

      - name: Resolve Base API Runtime
        id: base-api
        run: |
          DEFAULT_IMAGE="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          DEFAULT_PORT="80"
          CURRENT_IMAGE=$(az containerapp show \
            --resource-group nl-prod-convolens-rg \
            --name nl-prod-convolens-api \
            --query 'properties.template.containers[0].image' \
            -o tsv 2>/dev/null || true)
          CURRENT_PORT=$(az containerapp show \
            --resource-group nl-prod-convolens-rg \
            --name nl-prod-convolens-api \
            --query 'properties.configuration.ingress.targetPort' \
            -o tsv 2>/dev/null || true)
          if [ -z "$CURRENT_IMAGE" ]; then
            CURRENT_IMAGE="$DEFAULT_IMAGE"
          fi
          if [ "$CURRENT_IMAGE" = "$DEFAULT_IMAGE" ] || [ -z "$CURRENT_PORT" ]; then
            CURRENT_PORT="$DEFAULT_PORT"
          fi
          echo "image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"
          echo "target-port=$CURRENT_PORT" >> "$GITHUB_OUTPUT"

      - name: Preload Web Secrets Into Existing Key Vault
        if: inputs.deployment_environment == 'Production'
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          MYSTIRA_IDENTITY_CLIENT_SECRET: ${{ secrets.MYSTIRA_IDENTITY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if ! az keyvault show --name "${{ steps.target.outputs.key-vault-name }}" --only-show-errors >/dev/null 2>&1; then
            echo "Key Vault is not provisioned yet; the base Terraform apply will create it."
            exit 0
          fi
          if [ -z "$NEXTAUTH_SECRET" ] || [ -z "$MYSTIRA_IDENTITY_CLIENT_SECRET" ]; then
            echo "Error: NEXTAUTH_SECRET and MYSTIRA_IDENTITY_CLIENT_SECRET are required." >&2
            exit 1
          fi
          az keyvault secret set \
            --vault-name "${{ steps.target.outputs.key-vault-name }}" \
            --name nextauth-secret \
            --value "$NEXTAUTH_SECRET" \
            --output none
          az keyvault secret set \
            --vault-name "${{ steps.target.outputs.key-vault-name }}" \
            --name mystira-identity-client-secret \
            --value "$MYSTIRA_IDENTITY_CLIENT_SECRET" \
            --output none
          if az webapp show \
            --resource-group nl-prod-convolens-rg \
            --name "${{ steps.target.outputs.web-name }}" \
            --only-show-errors >/dev/null 2>&1; then
            az webapp config appsettings set \
              --resource-group nl-prod-convolens-rg \
              --name "${{ steps.target.outputs.web-name }}" \
              --settings \
                "NEXTAUTH_SECRET=@Microsoft.KeyVault(VaultName=${{ steps.target.outputs.key-vault-name }};SecretName=nextauth-secret)" \
                "MYSTIRA_IDENTITY_CLIENT_SECRET=@Microsoft.KeyVault(VaultName=${{ steps.target.outputs.key-vault-name }};SecretName=mystira-identity-client-secret)" \
              --output none
          fi

      - name: Terraform Plan Base Infrastructure
        env:
          MYSTIRA_IDENTITY_CLIENT_ID: ${{ secrets.MYSTIRA_IDENTITY_CLIENT_ID }}
          API_JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.NEXTAUTH_SECRET }}
          SLUICE_API_KEY: ${{ secrets.SLUICE_API_KEY }}
          TF_VAR_mystira_admin_emails: ${{ vars.MYSTIRA_ADMIN_EMAILS }}
          TF_VAR_mystira_admin_subjects: ${{ vars.MYSTIRA_ADMIN_SUBJECTS }}
        run: |
          export TF_VAR_mystira_identity_client_id="$MYSTIRA_IDENTITY_CLIENT_ID"
          if [ "$TF_VAR_manage_runtime_secrets_with_terraform" = "true" ]; then
            export TF_VAR_api_jwt_secret="$API_JWT_SECRET"
            export TF_VAR_sluice_api_key="$SLUICE_API_KEY"
          fi
          # Production-NeuralLiquid preloads the Celladore cutover key under its own
          # secret name in Key Vault rather than rotating the legacy sluice-api-key in
          # place, so the plan must reference that name to pick it up.
          if [ "${{ inputs.deployment_environment }}" = "Production-NeuralLiquid" ]; then
            export TF_VAR_sluice_api_key_secret_name="sluice-api-key-celladore"
          fi
          terraform -chdir=infra/terraform/env/prod plan \
            -out=base.tfplan \
            -var "container_image_api=${{ steps.base-api.outputs.image }}" \
            -var "api_target_port=${{ steps.base-api.outputs.target-port }}"

      - name: Terraform Apply Base Infrastructure
        run: terraform -chdir=infra/terraform/env/prod apply base.tfplan

      - name: Ensure Web Secrets In Key Vault
        if: inputs.deployment_environment == 'Production'
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          MYSTIRA_IDENTITY_CLIENT_SECRET: ${{ secrets.MYSTIRA_IDENTITY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$NEXTAUTH_SECRET" ] || [ -z "$MYSTIRA_IDENTITY_CLIENT_SECRET" ]; then
            echo "Error: NEXTAUTH_SECRET and MYSTIRA_IDENTITY_CLIENT_SECRET are required." >&2
            exit 1
          fi
          az keyvault secret set \
            --vault-name "${{ steps.target.outputs.key-vault-name }}" \
            --name nextauth-secret \
            --value "$NEXTAUTH_SECRET" \
            --output none
          az keyvault secret set \
            --vault-name "${{ steps.target.outputs.key-vault-name }}" \
            --name mystira-identity-client-secret \
            --value "$MYSTIRA_IDENTITY_CLIENT_SECRET" \
            --output none

      - name: Capture Terraform Outputs
        id: tf
        run: |
          terraform -chdir=infra/terraform/env/prod output -json > tf-outputs.json
          echo "resource-group=$(jq -r '.resource_group_name.value' tf-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "api-url=$(jq -r '.container_app_url.value' tf-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "web-url=$(jq -r '.frontend_default_hostname.value' tf-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "web-name=$(jq -r '.frontend_name.value' tf-outputs.json)" >> "$GITHUB_OUTPUT"
          ACR_LOGIN_SERVER=$(jq -r '.container_registry_login_server.value' tf-outputs.json)
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "ACR output is empty; enable_container_registry must be true for production deploy." >&2
            exit 1
          fi
          echo "acr-login-server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "acr-name=${ACR_LOGIN_SERVER%%.azurecr.io}" >> "$GITHUB_OUTPUT"

      - name: Build and Push API Image
        id: api-image
        run: |
          IMAGE="${{ steps.tf.outputs.acr-login-server }}/convolens-api:${{ github.sha }}"
          az acr build \
            --registry "${{ steps.tf.outputs.acr-name }}" \
            --image "convolens-api:${{ github.sha }}" \
            --file apps/api/Dockerfile \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan API Image
        env:
          MYSTIRA_IDENTITY_CLIENT_ID: ${{ secrets.MYSTIRA_IDENTITY_CLIENT_ID }}
          API_JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.NEXTAUTH_SECRET }}
          SLUICE_API_KEY: ${{ secrets.SLUICE_API_KEY }}
          TF_VAR_mystira_admin_emails: ${{ vars.MYSTIRA_ADMIN_EMAILS }}
          TF_VAR_mystira_admin_subjects: ${{ vars.MYSTIRA_ADMIN_SUBJECTS }}
        run: |
          export TF_VAR_mystira_identity_client_id="$MYSTIRA_IDENTITY_CLIENT_ID"
          if [ "$TF_VAR_manage_runtime_secrets_with_terraform" = "true" ]; then
            export TF_VAR_api_jwt_secret="$API_JWT_SECRET"
            export TF_VAR_sluice_api_key="$SLUICE_API_KEY"
          fi
          if [ "${{ inputs.deployment_environment }}" = "Production-NeuralLiquid" ]; then
            export TF_VAR_sluice_api_key_secret_name="sluice-api-key-celladore"
          fi
          terraform -chdir=infra/terraform/env/prod plan \
            -out=api-image.tfplan \
            -var "container_image_api=${{ steps.api-image.outputs.image }}" \
            -var "api_target_port=3001"

      - name: Terraform Apply API Image
        run: terraform -chdir=infra/terraform/env/prod apply api-image.tfplan

      - name: Rebuild Web With Production API URL
        timeout-minutes: 15
        run: pnpm --filter @convolens/web... build
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: ${{ steps.tf.outputs.api-url }}/api
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.tf.outputs.api-url }}

      - name: Package Web Standalone
        run: |
          rm -rf deploy-web web.zip
          mkdir -p deploy-web
          cp -R apps/web/.next/standalone/. deploy-web/
          mkdir -p deploy-web/apps/web/.next/static
          cp -R apps/web/.next/static/. deploy-web/apps/web/.next/static/
          if [ -d apps/web/public ]; then
            mkdir -p deploy-web/apps/web/public
            cp -R apps/web/public/. deploy-web/apps/web/public/
          fi
          if [ -d apps/web/node_modules ]; then
            mkdir -p deploy-web/apps/web/node_modules
            cp -Rn apps/web/node_modules/. deploy-web/apps/web/node_modules/
          fi
          while find deploy-web -type l -print -quit | grep -q .; do
            find deploy-web -type l -print0 | while IFS= read -r -d '' link; do
              target=$(readlink -f "$link" || true)
              rm "$link"
              if [ -n "$target" ] && [ -e "$target" ]; then
                cp -R "$target" "$link"
              fi
            done
          done
          for package in @next/env @swc/helpers baseline-browser-mapping caniuse-lite postcss styled-jsx; do
            package_dir="$(node -e "const fs = require('fs'); const path = require('path'); const nextPackage = require.resolve('next/package.json', { paths: [process.cwd() + '/apps/web'] }); const nextModules = path.dirname(nextPackage).replace(/[\\/]next$/, ''); const entry = require.resolve(process.argv[1], { paths: [nextModules, process.cwd() + '/apps/web'] }); let dir = path.dirname(entry); while (!fs.existsSync(path.join(dir, 'package.json'))) { const parent = path.dirname(dir); if (parent === dir) throw new Error('package root not found'); dir = parent; } process.stdout.write(dir)" "$package")"
            mkdir -p "deploy-web/apps/web/node_modules/$(dirname "$package")"
            rm -rf "deploy-web/apps/web/node_modules/$package"
            cp -R "$package_dir" "deploy-web/apps/web/node_modules/$package"
          done
          (cd deploy-web/apps/web && PORT=8080 node server.js) > web-startup.log 2>&1 &
          WEB_PID=$!
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:8080" > /dev/null; then
              kill "$WEB_PID"
              wait "$WEB_PID" || true
              break
            fi
            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              cat web-startup.log
              exit 1
            fi
            sleep 1
          done
          if kill -0 "$WEB_PID" 2>/dev/null; then
            cat web-startup.log
            kill "$WEB_PID"
            wait "$WEB_PID" || true
            echo "Web package did not become ready within 30 seconds." >&2
            exit 1
          fi
          cd deploy-web
          zip -r ../web.zip .

      - name: Deploy Web App
        run: |
          az webapp config appsettings set \
            --resource-group "${{ steps.tf.outputs.resource-group }}" \
            --name "${{ steps.tf.outputs.web-name }}" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false WEBSITE_RUN_FROM_PACKAGE=1
          az webapp deploy \
            --resource-group "${{ steps.tf.outputs.resource-group }}" \
            --name "${{ steps.tf.outputs.web-name }}" \
            --src-path web.zip \
            --track-status false \
            --type zip
          az webapp restart \
            --resource-group "${{ steps.tf.outputs.resource-group }}" \
            --name "${{ steps.tf.outputs.web-name }}"

      - name: Smoke Test
        run: |
          smoke() {
            local method="$1"
            local url="$2"
            for attempt in {1..12}; do
              local curl_args=(-fsS --max-time 30)
              if [ -n "$method" ]; then
                curl_args+=("$method")
              fi
              if curl "${curl_args[@]}" "$url" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            local curl_args=(-fsS --max-time 30)
            if [ -n "$method" ]; then
              curl_args+=("$method")
            fi
            curl "${curl_args[@]}" "$url" >/dev/null
          }

          smoke "" "${{ steps.tf.outputs.api-url }}/ready"
          smoke "-I" "${{ steps.tf.outputs.web-url }}"
          for attempt in {1..12}; do
            if curl -fsS --max-time 30 "${{ steps.tf.outputs.web-url }}/api/runtime/auth-status" | jq -e '.mystiraConfigured == true' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          curl -fsS --max-time 30 "${{ steps.tf.outputs.web-url }}/api/runtime/auth-status" | jq -e '.mystiraConfigured == true' >/dev/null
