name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  # PRs share a group so superseded runs cancel. Pushes use github.sha so
  # concurrent main commits are not collapsed — GitHub keeps only one pending
  # run per group and would otherwise drop the middle SHA.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Build
        run: pnpm run build
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Lint web
        run: pnpm --filter @convolens/web lint

      # Runs in every workspace project that defines a typecheck script. A new
      # project is gated as soon as it lands.
      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test web quality gates
        run: pnpm --filter @convolens/web run test -- src/lib/__tests__/quality-gates.test.ts --runInBand

      - name: Test extension capture matrix
        run: pnpm --filter @convolens/chrome-extension test

      - name: Install extension fixture browser
        run: pnpm --filter @convolens/chrome-extension exec playwright install --with-deps chromium

      - name: Test extension browser fixtures
        run: xvfb-run --auto-servernum pnpm --filter @convolens/chrome-extension test:browser:fixtures

      - name: Test extension persistence fixtures
        run: xvfb-run --auto-servernum pnpm --filter @convolens/chrome-extension test:browser:persistence

      # Runs every suite matched by jest.config.js testMatch. Do not reintroduce
      # an explicit file list here: new suites must be picked up automatically.
      - name: Test API
        run: pnpm --filter @convolens/api exec jest --config=jest.config.js --ci --runInBand

      - name: Package and inspect extension
        run: pnpm --filter @convolens/chrome-extension package

      - name: Validate Firefox extension manifest
        run: pnpm --filter @convolens/chrome-extension lint:firefox

      - name: Write extension checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/chrome-extension
        run: |
          sha256sum convolens-extension.zip > convolens-extension.zip.sha256
          sha256sum convolens-extension-firefox.zip > convolens-extension-firefox.zip.sha256

      - name: Upload current-main extension artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: convolens-extension-${{ github.sha }}
          path: |
            apps/chrome-extension/convolens-extension.zip
            apps/chrome-extension/convolens-extension.zip.sha256
            apps/chrome-extension/convolens-extension-firefox.zip
            apps/chrome-extension/convolens-extension-firefox.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-extension-release:
    name: Publish Extension Release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: extension-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Download validated extension artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: convolens-extension-${{ github.sha }}

      - name: Verify validated checksum
        run: |
          sha256sum --check convolens-extension.zip.sha256
          sha256sum --check convolens-extension-firefox.zip.sha256

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' apps/chrome-extension/manifest.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Extension manifest version is not a supported semantic version: $VERSION" >&2
            exit 1
          fi
          TAG="extension-v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p \
              "$RUNNER_TEMP/current/chrome" \
              "$RUNNER_TEMP/current/firefox" \
              "$RUNNER_TEMP/released/chrome" \
              "$RUNNER_TEMP/released/firefox" \
              "$RUNNER_TEMP/assets"
            unzip -qq convolens-extension.zip -d "$RUNNER_TEMP/current/chrome"
            unzip -qq convolens-extension-firefox.zip -d "$RUNNER_TEMP/current/firefox"
            gh release download "$TAG" \
              --pattern convolens-extension.zip \
              --pattern convolens-extension.zip.sha256 \
              --pattern convolens-extension-firefox.zip \
              --pattern convolens-extension-firefox.zip.sha256 \
              --dir "$RUNNER_TEMP/assets"
            (
              cd "$RUNNER_TEMP/assets"
              sha256sum --check convolens-extension.zip.sha256
              sha256sum --check convolens-extension-firefox.zip.sha256
            )
            unzip -qq "$RUNNER_TEMP/assets/convolens-extension.zip" \
              -d "$RUNNER_TEMP/released/chrome"
            unzip -qq "$RUNNER_TEMP/assets/convolens-extension-firefox.zip" \
              -d "$RUNNER_TEMP/released/firefox"
            (
              cd "$RUNNER_TEMP/current"
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$RUNNER_TEMP/current-payload.sha256"
            (
              cd "$RUNNER_TEMP/released"
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$RUNNER_TEMP/released-payload.sha256"
            if ! cmp -s \
              "$RUNNER_TEMP/current-payload.sha256" \
              "$RUNNER_TEMP/released-payload.sha256"; then
              echo "Release $TAG already exists with different extension payloads." >&2
              echo "Bump manifest and package versions before publishing changed extension code." >&2
              exit 1
            fi
            echo "Release $TAG already contains these validated extension payloads."
            exit 0
          fi

          TAG_TARGET=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk 'NR == 1 { print $1 }')
          if [ -z "$TAG_TARGET" ]; then
            TAG_TARGET=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')
          fi
          if [ -n "$TAG_TARGET" ] && [ "$TAG_TARGET" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG already points to $TAG_TARGET, not validated commit $GITHUB_SHA." >&2
            echo "Delete or repair the orphaned tag before publishing this release." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "convolens-extension.zip#ConvoLens extension v${VERSION}" \
            "convolens-extension.zip.sha256#SHA-256 checksum" \
            "convolens-extension-firefox.zip#ConvoLens Firefox private-preview build v${VERSION}" \
            "convolens-extension-firefox.zip.sha256#Firefox SHA-256 checksum" \
            --target "$GITHUB_SHA" \
            --title "ConvoLens Extension v${VERSION}" \
            --notes "Validated Chrome and unsigned Firefox private-preview builds from commit ${GITHUB_SHA}. The Firefox ZIP is for temporary installation through about:debugging until Mozilla signing is completed."
